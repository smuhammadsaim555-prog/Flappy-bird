<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Flappy Bird – NexusPlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a, #0a0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border: 2px solid #ffaa44;
            display: block;
            cursor: pointer;
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .score-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .best-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: #ffaa44;
            font-weight: bold;
            font-size: 14px;
        }

        .season-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }

        /* NexusPlay Main Menu */
        .main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1a2a3a, #0f1a2a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 25px;
        }

        .game-title {
            font-size: 38px;
            font-weight: bold;
            color: #ffaa44;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .play-btn {
            background: #ffaa44;
            border: none;
            padding: 15px 50px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.1s;
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        .bottom-menu {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .bottom-btn {
            background: none;
            border: none;
            color: #ffaa44;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            transition: 0.1s;
        }

        .bottom-btn:active {
            transform: scale(0.95);
            color: white;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            border-radius: 25px;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-title {
            color: #ffaa44;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .final-score {
            color: white;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: #ffaa44;
            border: none;
            padding: 12px 35px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="ui-panel">
        <div class="score-display">SCORE: <span id="score">0</span></div>
        <div class="best-display">🏆 BEST: <span id="bestScore">0</span></div>
    </div>
    <div class="season-badge" id="seasonBadge">🌞 SUMMER</div>

    <div id="mainMenu" class="main-menu">
        <div class="game-title">FLAPPY BIRD</div>
        <button class="play-btn" id="playBtn">PLAY</button>
        <div class="bottom-menu">
            <button class="bottom-btn" id="scoresBtn">SCORES</button>
        </div>
    </div>

    <div id="gameOverScreen" class="game-over-screen">
        <div class="game-over-title">GAME OVER</div>
        <div class="final-score">SCORE: <span id="finalScore">0</span></div>
        <button class="restart-btn" id="restartBtn">PLAY AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==================== SEASONS ====================
    let currentSeason = 'summer';
    let snowParticles = [];
    let leafParticles = [];
    let rainParticles = [];
    let blossomParticles = [];
    let sunRays = [];
    
    function getSeason(score) {
        if(score >= 60) return 'winter';
        if(score >= 45) return 'autumn';
        if(score >= 30) return 'spring';
        if(score >= 15) return 'rainy';
        return 'summer';
    }
    
    function updateSeason(score) {
        const newSeason = getSeason(score);
        if(newSeason !== currentSeason) {
            currentSeason = newSeason;
            const badge = document.getElementById('seasonBadge');
            if(currentSeason === 'summer') badge.innerHTML = '☀️ SUMMER';
            else if(currentSeason === 'rainy') badge.innerHTML = '☔ RAINY SEASON';
            else if(currentSeason === 'spring') badge.innerHTML = '🌸 SPRING TIME';
            else if(currentSeason === 'autumn') badge.innerHTML = '🍂 AUTUMN';
            else if(currentSeason === 'winter') badge.innerHTML = '❄️ WINTER';
            
            // Initialize particles for season
            if(currentSeason === 'winter') {
                snowParticles = [];
                for(let i=0; i<80; i++) {
                    snowParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 4 + 2, speed: Math.random() * 2 + 1 });
                }
            } else if(currentSeason === 'autumn') {
                leafParticles = [];
                for(let i=0; i<50; i++) {
                    leafParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 6 + 4, speed: Math.random() * 1.5 + 0.5, sway: Math.random() * Math.PI * 2 });
                }
            } else if(currentSeason === 'spring') {
                blossomParticles = [];
                for(let i=0; i<60; i++) {
                    blossomParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 4 + 2, speed: Math.random() * 1 + 0.5 });
                }
            } else if(currentSeason === 'rainy') {
                rainParticles = [];
                for(let i=0; i<120; i++) {
                    rainParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, length: Math.random() * 8 + 4, speed: Math.random() * 5 + 3 });
                }
            } else if(currentSeason === 'summer') {
                sunRays = [];
                for(let i=0; i<12; i++) {
                    sunRays.push({ angle: (i * 30) * Math.PI / 180, length: 30 + Math.random() * 20 });
                }
            }
        }
        
        // Update particles
        if(currentSeason === 'winter') {
            for(let p of snowParticles) {
                p.y += p.speed;
                if(p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            }
        } else if(currentSeason === 'autumn') {
            for(let p of leafParticles) {
                p.y += p.speed;
                p.x += Math.sin(p.sway) * 0.5;
                p.sway += 0.05;
                if(p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            }
        } else if(currentSeason === 'spring') {
            for(let p of blossomParticles) {
                p.y += p.speed;
                p.x += Math.sin(Date.now() * 0.002 + p.y) * 0.3;
                if(p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            }
        } else if(currentSeason === 'rainy') {
            for(let p of rainParticles) {
                p.y += p.speed;
                if(p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            }
        }
    }
    
    // ==================== AUDIO ====================
    let audioCtx = null;
    function playSound(freq, dur, vol = 0.12) {
        try {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.value = vol;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
            setTimeout(() => { try { osc.stop(); } catch(e) {} }, dur * 1000);
        } catch(e) {}
    }
    
    // ==================== GAME VARIABLES ====================
    let bird = { x: 80, y: canvas.height/2, radius: 14, velocity: 0, gravity: 0.25, jumpPower: -5.5 };
    let pipes = [];
    let score = 0;
    let bestScore = localStorage.getItem('flappyBest') ? parseInt(localStorage.getItem('flappyBest')) : 0;
    let gameRunning = true;
    let gameActive = false;
    let frame = 0;
    let pipeGap = 150;
    let pipeWidth = 60;
    let pipeSpeed = 2;
    let bgOffset = 0;
    let wingAngle = 0;
    
    document.getElementById('bestScore').innerText = bestScore;
    
    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('bestScore').innerText = bestScore;
        updateSeason(score);
    }
    
    function initGame() {
        bird.y = canvas.height/2;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        gameRunning = true;
        frame = 0;
        updateUI();
    }
    
    function addPipe() {
        const minH = 50;
        const maxH = canvas.height - pipeGap - minH;
        const topH = Math.floor(Math.random() * (maxH - minH + 1) + minH);
        pipes.push({ x: canvas.width, topHeight: topH, bottomY: topH + pipeGap, counted: false });
    }
    
    function updateGame() {
        if(!gameActive || !gameRunning) return;
        
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        
        if(bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height) { gameOver(); return; }
        
        bgOffset = (bgOffset + 0.3) % canvas.width;
        
        if(frame % 100 === 0) addPipe();
        
        for(let i=0; i<pipes.length; i++) {
            pipes[i].x -= pipeSpeed;
            if(!pipes[i].counted && pipes[i].x + pipeWidth < bird.x) {
                pipes[i].counted = true;
                score++;
                updateUI();
                playSound(660, 0.1, 0.08);
                if(score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappyBest', bestScore);
                    updateUI();
                }
            }
            if(bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + pipeWidth) {
                if(bird.y - bird.radius < pipes[i].topHeight || bird.y + bird.radius > pipes[i].bottomY) { gameOver(); return; }
            }
            if(pipes[i].x + pipeWidth < 0) { pipes.splice(i,1); i--; }
        }
        frame++;
    }
    
    function gameOver() {
        gameRunning = false;
        gameActive = false;
        playSound(220, 0.3, 0.15);
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverScreen').classList.add('show');
    }
    
    function restartGame() {
        initGame();
        document.getElementById('gameOverScreen').classList.remove('show');
        gameActive = true;
    }
    
    function jump() {
        if(!gameActive) return;
        if(!gameRunning) { restartGame(); return; }
        bird.velocity = bird.jumpPower;
        playSound(880, 0.12, 0.1);
    }
    
    // ==================== SEASONAL BACKGROUNDS ====================
    function drawBackground() {
        // Sky gradient based on season
        let grad;
        if(currentSeason === 'summer') grad = ctx.createLinearGradient(0,0,0,canvas.height);
        else if(currentSeason === 'rainy') grad = ctx.createLinearGradient(0,0,0,canvas.height);
        else if(currentSeason === 'spring') grad = ctx.createLinearGradient(0,0,0,canvas.height);
        else if(currentSeason === 'autumn') grad = ctx.createLinearGradient(0,0,0,canvas.height);
        else grad = ctx.createLinearGradient(0,0,0,canvas.height);
        
        if(currentSeason === 'summer') {
            grad.addColorStop(0, '#FFD700');
            grad.addColorStop(0.3, '#87CEEB');
            grad.addColorStop(1, '#E0F6FF');
        } else if(currentSeason === 'rainy') {
            grad.addColorStop(0, '#4A5D6E');
            grad.addColorStop(1, '#6B8E9B');
        } else if(currentSeason === 'spring') {
            grad.addColorStop(0, '#FFB6C1');
            grad.addColorStop(0.5, '#FFC0CB');
            grad.addColorStop(1, '#98FB98');
        } else if(currentSeason === 'autumn') {
            grad.addColorStop(0, '#FF8C69');
            grad.addColorStop(0.5, '#FF7F50');
            grad.addColorStop(1, '#DEB887');
        } else if(currentSeason === 'winter') {
            grad.addColorStop(0, '#708090');
            grad.addColorStop(1, '#B0C4DE');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Sun for summer
        if(currentSeason === 'summer') {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(320, 70, 35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,215,0,0.3)';
            for(let i=0; i<12; i++) {
                let angle = (i * 30) * Math.PI / 180;
                let x1 = 320 + Math.cos(angle) * 50;
                let y1 = 70 + Math.sin(angle) * 50;
                let x2 = 320 + Math.cos(angle) * 75;
                let y2 = 70 + Math.sin(angle) * 75;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }
        
        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.ellipse(70, 70 + bgOffset * 0.3, 45, 35, 0, 0, Math.PI*2);
        ctx.ellipse(115, 60 + bgOffset * 0.3, 40, 30, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(300, 110 + bgOffset * 0.3, 50, 38, 0, 0, Math.PI*2);
        ctx.ellipse(350, 100 + bgOffset * 0.3, 42, 32, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Dark clouds for rainy
        if(currentSeason === 'rainy') {
            ctx.fillStyle = 'rgba(80,90,100,0.6)';
            ctx.beginPath();
            ctx.ellipse(50, 80, 55, 40, 0, 0, Math.PI*2);
            ctx.ellipse(100, 70, 50, 38, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(280, 100, 60, 42, 0, 0, Math.PI*2);
            ctx.ellipse(340, 90, 52, 38, 0, 0, Math.PI*2);
            ctx.fill();
        }
        
        // Seasonal particles
        if(currentSeason === 'rainy') {
            for(let r of rainParticles) {
                ctx.strokeStyle = 'rgba(150,180,200,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x - 3, r.y + r.length);
                ctx.stroke();
            }
        } else if(currentSeason === 'spring') {
            for(let b of blossomParticles) {
                ctx.fillStyle = '#FFB7C5';
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, b.size/2, b.size/2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.ellipse(b.x - 1, b.y - 1, b.size/3, b.size/3, 0, 0, Math.PI*2);
                ctx.fill();
            }
        } else if(currentSeason === 'autumn') {
            for(let l of leafParticles) {
                ctx.fillStyle = '#FF6347';
                ctx.beginPath();
                ctx.ellipse(l.x, l.y, l.size/2, l.size/3, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#D2691E';
                ctx.beginPath();
                ctx.ellipse(l.x - 2, l.y, l.size/4, l.size/4, 0, 0, Math.PI*2);
                ctx.fill();
            }
        } else if(currentSeason === 'winter') {
            for(let s of snowParticles) {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }
    
    function drawPipes() {
        for(let pipe of pipes) {
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.topHeight - 25, pipeWidth - 10, 20);
            
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.bottomY + 5, pipeWidth - 10, 20);
        }
    }
    
    function drawBird() {
        wingAngle = (wingAngle + 0.2) % (Math.PI * 2);
        const wingOffset = Math.sin(wingAngle) * 5;
        
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(Math.min(Math.max(bird.velocity * 0.08, -0.5), 0.7));
        
        ctx.fillStyle = '#FFD966';
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.radius, bird.radius * 0.9, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#E6A817';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(5, -3, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -4, 1, 0, Math.PI*2);
        ctx.fill();
        
        ctx.fillStyle = '#FFAA44';
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(-15 + wingOffset, -5);
        ctx.lineTo(-15 + wingOffset, 5);
        ctx.fill();
        
        ctx.fillStyle = '#FF6600';
        ctx.beginPath();
        ctx.moveTo(11, -2);
        ctx.lineTo(19, 0);
        ctx.lineTo(11, 2);
        ctx.fill();
        
        ctx.fillStyle = '#E6A817';
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(-3, -20);
        ctx.lineTo(3, -18);
        ctx.fill();
        
        ctx.restore();
    }
    
    function drawGround() {
        if(currentSeason === 'winter') {
            ctx.fillStyle = '#E8E8F0';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = '#D0D0E0';
            for(let i=0; i<20; i++) {
                ctx.fillRect(i*30 + (bgOffset % 30), canvas.height-55, 15, 8);
            }
            ctx.fillStyle = '#C0C0D0';
            ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
        } else {
            ctx.fillStyle = '#6B4E3A';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = '#8B5A2B';
            for(let i=0; i<20; i++) {
                ctx.fillRect(i*30 + (bgOffset % 30), canvas.height-55, 15, 8);
            }
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
        }
    }
    
    function drawScoreOnCanvas() {
        if(gameActive && gameRunning) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 42px monospace';
            ctx.fillText(score, canvas.width/2 - 15, 80);
        }
    }
    
    function draw() {
        drawBackground();
        drawPipes();
        drawBird();
        drawGround();
        drawScoreOnCanvas();
        
        if(!gameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 24px monospace';
            ctx.fillText('FLAPPY BIRD', canvas.width/2-100, canvas.height/2-30);
            ctx.fillStyle = 'white';
            ctx.font = '14px monospace';
            ctx.fillText('TAP TO START', canvas.width/2-55, canvas.height/2+20);
        }
        
        if(!gameRunning && gameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 26px monospace';
            ctx.fillText('GAME OVER', canvas.width/2-85, canvas.height/2-30);
            ctx.fillStyle = 'white';
            ctx.font = '16px monospace';
            ctx.fillText(`SCORE: ${score}`, canvas.width/2-50, canvas.height/2+20);
        }
    }
    
    // ==================== EVENT LISTENERS ====================
    canvas.addEventListener('click', () => {
        if(!gameActive) {
            document.getElementById('mainMenu').classList.add('hide');
            gameActive = true;
            initGame();
        }
        jump();
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(!gameActive) {
            document.getElementById('mainMenu').classList.add('hide');
            gameActive = true;
            initGame();
        }
        jump();
    });
    
    document.getElementById('playBtn').onclick = () => {
        document.getElementById('mainMenu').classList.add('hide');
        gameActive = true;
        initGame();
    };
    
    document.getElementById('scoresBtn').onclick = () => {
        alert(`🏆 BEST SCORE: ${bestScore}\n🎮 LATEST SCORE: ${score}`);
    };
    
    document.getElementById('restartBtn').onclick = () => {
        restartGame();
    };
    
    updateUI();
    
    function gameLoop() {
        updateGame();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>
</body>
</html>
