<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SkyRider – NexusPlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a, #0a0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border: 2px solid #ffaa44;
            display: block;
            background: #87CEEB;
            cursor: pointer;
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .score-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .best-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: #ffaa44;
            font-weight: bold;
            font-size: 14px;
        }

        .season-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }

        /* Music Button */
        .music-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #ffaa44;
            border-radius: 40px;
            padding: 6px 16px;
            color: #ffaa44;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
        }

        /* NexusPlay Home Page */
        .home-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1a2a3a, #0f1a2a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 25px;
        }

        .game-title {
            font-size: 38px;
            font-weight: bold;
            color: #ffaa44;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .home-bird {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .home-bird img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 70%;
            max-width: 220px;
            margin-top: 20px;
        }

        .menu-btn {
            background: rgba(0,0,0,0.6);
            border: 2px solid #ffaa44;
            padding: 10px;
            border-radius: 50px;
            color: #ffaa44;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        .tap-text {
            color: white;
            font-size: 12px;
            margin-top: 15px;
            opacity: 0.7;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="ui-panel">
        <div class="score-display">SCORE: <span id="score">0</span></div>
        <div class="best-display">🏆 BEST: <span id="bestScore">0</span></div>
    </div>
    <div class="season-badge" id="seasonBadge">☀️ SUMMER</div>
    <button class="music-btn" id="musicBtn">🔇 MUSIC OFF</button>

    <!-- NexusPlay Home Page -->
    <div id="homePage" class="home-page">
        <div class="game-title">SKYRIDER</div>
        <div class="home-bird">
            <img id="homeBirdImg" src="bird_normal.png" alt="Eagle">
        </div>
        <div class="menu-buttons">
            <div class="menu-btn" id="playMenuBtn">▶ PLAY</div>
            <div class="menu-btn" id="storeMenuBtn">🛒 STORE</div>
            <div class="menu-btn" id="scoresMenuBtn">🏆 SCORES</div>
            <div class="menu-btn" id="optionsMenuBtn">⚙️ OPTIONS</div>
        </div>
        <div class="tap-text">👇 TAP PLAY TO START 👇</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==================== LOAD IMAGES (ROOT DIRECTORY) ====================
    const birdImages = {
        normal: new Image(),
        wingUp: new Image(),
        wingDown: new Image(),
        dead: new Image()
    };
    
    const bgImages = {
        summer: new Image(),
        rainy: new Image(),
        spring: new Image(),
        autumn: new Image(),
        winter: new Image()
    };
    
    birdImages.normal.src = 'bird_normal.png';
    birdImages.wingUp.src = 'bird_wing_up.png';
    birdImages.wingDown.src = 'bird_wing_down.png';
    birdImages.dead.src = 'bird_dead.png';
    
    bgImages.summer.src = 'bg_summer.png';
    bgImages.rainy.src = 'bg_rainy.png';
    bgImages.spring.src = 'bg_spring.png';
    bgImages.autumn.src = 'bg_autumn.png';
    bgImages.winter.src = 'bg_winter.png';
    
    document.getElementById('homeBirdImg').src = 'bird_normal.png';
    
    // ==================== SEASON EFFECTS PARTICLES ====================
    let particles = [];
    
    function initParticles(season) {
        particles = [];
        let count = 0;
        if(season === 'rainy') count = 80;
        else if(season === 'spring') count = 50;
        else if(season === 'autumn') count = 40;
        else if(season === 'winter') count = 70;
        else count = 0;
        
        for(let i=0; i<count; i++) {
            if(season === 'rainy') {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 5 + 3, type: 'rain' });
            } else if(season === 'spring') {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 1.5 + 0.5, type: 'blossom', size: Math.random() * 4 + 2 });
            } else if(season === 'autumn') {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 1.5 + 0.5, type: 'leaf', size: Math.random() * 5 + 3, sway: Math.random() * Math.PI * 2 });
            } else if(season === 'winter') {
                particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 2 + 1, type: 'snow', size: Math.random() * 3 + 2 });
            }
        }
    }
    
    function updateParticles() {
        for(let p of particles) {
            p.y += p.speed;
            if(p.type === 'rain') {
                if(p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
            } else if(p.type === 'blossom') {
                p.x += Math.sin(Date.now() * 0.002 + p.y) * 0.3;
                if(p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
            } else if(p.type === 'leaf') {
                p.x += Math.sin(p.sway) * 0.5;
                p.sway += 0.05;
                if(p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
            } else if(p.type === 'snow') {
                p.x += Math.sin(Date.now() * 0.001 + p.y) * 0.2;
                if(p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
            }
        }
    }
    
    function drawParticles() {
        for(let p of particles) {
            if(p.type === 'rain') {
                ctx.strokeStyle = 'rgba(150,180,200,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 3, p.y + 8);
                ctx.stroke();
            } else if(p.type === 'blossom') {
                ctx.fillStyle = '#FFB7C5';
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.size/2, p.size/2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.ellipse(p.x - 1, p.y - 1, p.size/3, p.size/3, 0, 0, Math.PI*2);
                ctx.fill();
            } else if(p.type === 'leaf') {
                ctx.fillStyle = '#FF6347';
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.size/2, p.size/3, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#D2691E';
                ctx.beginPath();
                ctx.ellipse(p.x - 2, p.y, p.size/4, p.size/4, 0, 0, Math.PI*2);
                ctx.fill();
            } else if(p.type === 'snow') {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }
    
    // ==================== MUSIC SYSTEM ====================
    let audioCtx = null;
    let musicActive = false;
    let musicInterval = null;
    
    function initMusic() {
        if(audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;
            masterGain.connect(audioCtx.destination);
            
            const melody = [262, 294, 330, 349, 392, 440, 494, 523];
            let noteIndex = 0;
            
            function playNote() {
                if(!musicActive || !audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = melody[noteIndex % melody.length];
                gain.gain.value = 0.08;
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
                noteIndex++;
                setTimeout(() => {
                    try { osc.stop(); } catch(e) {}
                }, 250);
            }
            
            musicInterval = setInterval(() => {
                if(musicActive && audioCtx && audioCtx.state === 'running') {
                    playNote();
                }
            }, 500);
        } catch(e) {}
    }
    
    function toggleMusic() {
        const btn = document.getElementById('musicBtn');
        if(!audioCtx) initMusic();
        if(!audioCtx) return;
        if(!musicActive) {
            audioCtx.resume().then(() => {
                musicActive = true;
                btn.innerHTML = '🔊 MUSIC ON';
                btn.style.background = '#4CAF50';
                btn.style.color = 'white';
            });
        } else {
            audioCtx.suspend();
            musicActive = false;
            btn.innerHTML = '🔇 MUSIC OFF';
            btn.style.background = 'rgba(0,0,0,0.7)';
            btn.style.color = '#ffaa44';
        }
    }
    
    document.getElementById('musicBtn').onclick = toggleMusic;
    
    // ==================== SEASONS ====================
    let currentSeason = 'summer';
    
    function getSeason(score) {
        if(score >= 60) return 'winter';
        if(score >= 45) return 'autumn';
        if(score >= 30) return 'spring';
        if(score >= 15) return 'rainy';
        return 'summer';
    }
    
    function getSeasonName(season) {
        const names = { summer: '☀️ SUMMER', rainy: '☔ RAINY', spring: '🌸 SPRING', autumn: '🍂 AUTUMN', winter: '❄️ WINTER' };
        return names[season];
    }
    
    function updateSeason(score) {
        const newSeason = getSeason(score);
        if(newSeason !== currentSeason) {
            currentSeason = newSeason;
            document.getElementById('seasonBadge').innerHTML = getSeasonName(currentSeason);
            initParticles(currentSeason);
        }
    }
    
    // ==================== SOUND EFFECTS ====================
    function playSound(freq, dur, vol = 0.15) {
        try {
            if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.value = vol;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + dur);
            setTimeout(() => { try { osc.stop(); } catch(e) {} }, dur * 1000);
        } catch(e) {}
    }
    
    // ==================== GAME VARIABLES ====================
    let bird = {
        x: 80,
        y: canvas.height/2,
        width: 38,
        height: 38,
        radius: 19,
        velocity: 0,
        gravity: 0.28,
        jumpPower: -6
    };
    
    let pipes = [];
    let score = 0;
    let bestScore = localStorage.getItem('skyRiderBest') ? parseInt(localStorage.getItem('skyRiderBest')) : 0;
    let gameRunning = true;
    let gameActive = false;
    let frame = 0;
    let pipeGap = 150;
    let pipeWidth = 60;
    let pipeSpeed = 2.2;
    let bgOffset = 0;
    let currentBirdFrame = 'normal';
    
    document.getElementById('bestScore').innerText = bestScore;
    
    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('bestScore').innerText = bestScore;
        updateSeason(score);
    }
    
    function initGame() {
        bird.y = canvas.height/2;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        gameRunning = true;
        frame = 0;
        currentSeason = 'summer';
        document.getElementById('seasonBadge').innerHTML = '☀️ SUMMER';
        initParticles('summer');
        updateUI();
    }
    
    function addPipe() {
        const minH = 50;
        const maxH = canvas.height - pipeGap - minH;
        const topH = Math.floor(Math.random() * (maxH - minH + 1) + minH);
        pipes.push({ x: canvas.width, topHeight: topH, bottomY: topH + pipeGap, counted: false });
    }
    
    function updateGame() {
        if(!gameActive || !gameRunning) return;
        
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        
        if(bird.velocity < -1) currentBirdFrame = 'wingUp';
        else if(bird.velocity > 1.5) currentBirdFrame = 'wingDown';
        else currentBirdFrame = 'normal';
        
        if(bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height) { gameOver(); return; }
        
        bgOffset = (bgOffset + 0.3) % canvas.width;
        
        if(frame % 100 === 0) addPipe();
        
        for(let i=0; i<pipes.length; i++) {
            pipes[i].x -= pipeSpeed;
            if(!pipes[i].counted && pipes[i].x + pipeWidth < bird.x) {
                pipes[i].counted = true;
                score++;
                updateUI();
                playSound(660, 0.1, 0.1);
                if(score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('skyRiderBest', bestScore);
                    updateUI();
                }
            }
            if(bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + pipeWidth) {
                if(bird.y - bird.radius < pipes[i].topHeight || bird.y + bird.radius > pipes[i].bottomY) { gameOver(); return; }
            }
            if(pipes[i].x + pipeWidth < 0) { pipes.splice(i,1); i--; }
        }
        frame++;
        updateParticles();
    }
    
    function gameOver() {
        gameRunning = false;
        gameActive = false;
        currentBirdFrame = 'dead';
        playSound(220, 0.4, 0.2);
        document.getElementById('homePage').classList.remove('hide');
    }
    
    function startGame() {
        document.getElementById('homePage').classList.add('hide');
        gameActive = true;
        gameRunning = true;
        initGame();
        currentBirdFrame = 'normal';
    }
    
    function jump() {
        if(!gameActive) return;
        if(!gameRunning) return;
        bird.velocity = bird.jumpPower;
        playSound(880, 0.15, 0.12);
    }
    
    // ==================== DRAWING ====================
    function drawBackground() {
        let bgImage;
        if(currentSeason === 'summer') bgImage = bgImages.summer;
        else if(currentSeason === 'rainy') bgImage = bgImages.rainy;
        else if(currentSeason === 'spring') bgImage = bgImages.spring;
        else if(currentSeason === 'autumn') bgImage = bgImages.autumn;
        else bgImage = bgImages.winter;
        
        if(bgImage.complete && bgImage.src && bgImage.naturalWidth > 0) {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        } else {
            const grad = ctx.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0, '#87CEEB');
            grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,canvas.width,canvas.height);
        }
        
        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.ellipse(70, 70 + bgOffset * 0.3, 45, 35, 0, 0, Math.PI*2);
        ctx.ellipse(115, 60 + bgOffset * 0.3, 40, 30, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(300, 110 + bgOffset * 0.3, 50, 38, 0, 0, Math.PI*2);
        ctx.ellipse(350, 100 + bgOffset * 0.3, 42, 32, 0, 0, Math.PI*2);
        ctx.fill();
    }
    
    function drawPipes() {
        for(let pipe of pipes) {
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.topHeight - 25, pipeWidth - 10, 20);
            
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.bottomY + 5, pipeWidth - 10, 20);
        }
    }
    
    function drawBird() {
        let birdImg;
        if(currentBirdFrame === 'wingUp') birdImg = birdImages.wingUp;
        else if(currentBirdFrame === 'wingDown') birdImg = birdImages.wingDown;
        else if(currentBirdFrame === 'dead') birdImg = birdImages.dead;
        else birdImg = birdImages.normal;
        
        if(birdImg.complete && birdImg.src && birdImg.naturalWidth > 0) {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(Math.min(Math.max(bird.velocity * 0.08, -0.5), 0.5));
            ctx.drawImage(birdImg, -bird.width/2, -bird.height/2, bird.width, bird.height);
            ctx.restore();
        } else {
            ctx.fillStyle = '#FFD966';
            ctx.beginPath();
            ctx.ellipse(bird.x, bird.y, bird.radius, bird.radius*0.9, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    function drawGround() {
        ctx.fillStyle = '#6B4E3A';
        ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
        ctx.fillStyle = '#8B5A2B';
        for(let i=0; i<20; i++) {
            ctx.fillRect(i*30 + (bgOffset % 30), canvas.height-55, 15, 8);
        }
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
    }
    
    function drawScoreOnCanvas() {
        if(gameActive && gameRunning) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 42px monospace';
            ctx.fillText(score, canvas.width/2 - 15, 80);
        }
    }
    
    function draw() {
        drawBackground();
        drawPipes();
        drawParticles();
        drawBird();
        drawGround();
        drawScoreOnCanvas();
        
        if(!gameRunning && gameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 26px monospace';
            ctx.fillText('GAME OVER', canvas.width/2-85, canvas.height/2-30);
            ctx.fillStyle = 'white';
            ctx.font = '16px monospace';
            ctx.fillText(`SCORE: ${score}`, canvas.width/2-50, canvas.height/2+20);
        }
    }
    
    // ==================== EVENT LISTENERS ====================
    canvas.addEventListener('click', () => { jump(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
    
    document.getElementById('playMenuBtn').onclick = () => { startGame(); };
    document.getElementById('storeMenuBtn').onclick = () => { alert('🛒 Store coming soon!'); };
    document.getElementById('scoresMenuBtn').onclick = () => { alert(`🏆 BEST SCORE: ${bestScore}`); };
    document.getElementById('optionsMenuBtn').onclick = () => { alert('⚙️ Options coming soon!'); };
    
    // Auto-start music on first touch
    document.addEventListener('touchstart', () => {
        if(!audioCtx) initMusic();
        if(!musicActive) {
            musicActive = true;
            if(audioCtx) audioCtx.resume();
            document.getElementById('musicBtn').innerHTML = '🔊 MUSIC ON';
            document.getElementById('musicBtn').style.background = '#4CAF50';
        }
    }, { once: true });
    
    // Make sure home page is visible at start
    document.getElementById('homePage').classList.remove('hide');
    initGame();
    initParticles('summer');
    
    function gameLoop() {
        updateGame();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>
</body>
</html>
