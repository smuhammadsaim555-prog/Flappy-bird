  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Flappy Bird – NexusPlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0f172a, #0a0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border: 2px solid #ffaa44;
            display: block;
            background: linear-gradient(180deg, #87CEEB, #E0F6FF);
            cursor: pointer;
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .score-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .best-display {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            color: #ffaa44;
            font-weight: bold;
            font-size: 14px;
        }

        /* NexusPlay Main Menu */
        .main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1a2a3a, #0f1a2a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 25px;
        }

        .game-title {
            font-size: 38px;
            font-weight: bold;
            color: #ffaa44;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .play-btn {
            background: #ffaa44;
            border: none;
            padding: 15px 50px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.1s;
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        .tournament-btn {
            background: rgba(255,255,255,0.15);
            border: 2px solid #ffaa44;
            padding: 10px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #ffaa44;
            cursor: pointer;
            margin-bottom: 30px;
            transition: 0.1s;
        }

        .tournament-btn:active {
            transform: scale(0.96);
        }

        .bottom-menu {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .bottom-btn {
            background: none;
            border: none;
            color: #ffaa44;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            transition: 0.1s;
        }

        .bottom-btn:active {
            transform: scale(0.95);
            color: white;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            border-radius: 25px;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-title {
            color: #ffaa44;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .final-score {
            color: white;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: #ffaa44;
            border: none;
            padding: 12px 35px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="ui-panel">
        <div class="score-display">SCORE: <span id="score">0</span></div>
        <div class="best-display">🏆 BEST: <span id="bestScore">0</span></div>
    </div>

    <!-- NexusPlay Main Menu -->
    <div id="mainMenu" class="main-menu">
        <div class="game-title">FLAPPY BIRD</div>
        <button class="play-btn" id="playBtn">PLAY</button>
        <button class="tournament-btn" id="tournamentBtn">TOURNAMENTS</button>
        <div class="bottom-menu">
            <button class="bottom-btn" id="storeMenuBtn">STORE</button>
            <button class="bottom-btn" id="scoresMenuBtn">SCORES</button>
            <button class="bottom-btn" id="optionsMenuBtn">OPTIONS</button>
        </div>
    </div>

    <div id="gameOverScreen" class="game-over-screen">
        <div class="game-over-title">GAME OVER</div>
        <div class="final-score">SCORE: <span id="finalScore">0</span></div>
        <button class="restart-btn" id="restartBtn">PLAY AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ==================== AUDIO SYSTEM ====================
    let audioCtx = null;
    
    function playSound(frequency, duration, volume = 0.12) {
        try {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = frequency;
            gain.gain.value = volume;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            setTimeout(() => {
                try { osc.stop(); } catch(e) {}
            }, duration * 1000);
        } catch(e) {}
    }
    
    // ==================== GAME VARIABLES ====================
    let bird = {
        x: 80,
        y: canvas.height/2,
        radius: 14,
        velocity: 0,
        gravity: 0.25,
        jumpPower: -5.5
    };
    
    let pipes = [];
    let score = 0;
    let bestScore = localStorage.getItem('flappyBest') ? parseInt(localStorage.getItem('flappyBest')) : 0;
    let gameRunning = true;
    let gameActive = false;
    let frame = 0;
    let pipeGap = 150;
    let pipeWidth = 60;
    let pipeSpeed = 2;
    let backgroundOffset = 0;
    let wingAngle = 0;
    
    document.getElementById('bestScore').innerText = bestScore;
    
    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('bestScore').innerText = bestScore;
    }
    
    function initGame() {
        bird.y = canvas.height/2;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        gameRunning = true;
        frame = 0;
        updateUI();
    }
    
    function addPipe() {
        const minHeight = 50;
        const maxHeight = canvas.height - pipeGap - minHeight;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
        pipes.push({
            x: canvas.width,
            topHeight: topHeight,
            bottomY: topHeight + pipeGap,
            counted: false
        });
    }
    
    function updateGame() {
        if(!gameActive || !gameRunning) return;
        
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        
        if(bird.y - bird.radius <= 0 || bird.y + bird.radius >= canvas.height) {
            gameOver();
            return;
        }
        
        backgroundOffset = (backgroundOffset + 0.3) % canvas.width;
        
        if(frame % 100 === 0) {
            addPipe();
        }
        
        for(let i=0; i<pipes.length; i++) {
            pipes[i].x -= pipeSpeed;
            
            if(!pipes[i].counted && pipes[i].x + pipeWidth < bird.x) {
                pipes[i].counted = true;
                score++;
                updateUI();
                playSound(660, 0.1, 0.08);
                if(score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappyBest', bestScore);
                    updateUI();
                }
            }
            
            if(bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + pipeWidth) {
                if(bird.y - bird.radius < pipes[i].topHeight || bird.y + bird.radius > pipes[i].bottomY) {
                    gameOver();
                    return;
                }
            }
            
            if(pipes[i].x + pipeWidth < 0) {
                pipes.splice(i,1);
                i--;
            }
        }
        frame++;
    }
    
    function gameOver() {
        gameRunning = false;
        gameActive = false;
        playSound(220, 0.3, 0.15);
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverScreen').classList.add('show');
    }
    
    function restartGame() {
        initGame();
        document.getElementById('gameOverScreen').classList.remove('show');
        gameActive = true;
    }
    
    function jump() {
        if(!gameActive) return;
        if(!gameRunning) {
            restartGame();
            return;
        }
        bird.velocity = bird.jumpPower;
        playSound(880, 0.12, 0.1);
    }
    
    // ==================== DRAWING ====================
    function drawBackground() {
        const grad = ctx.createLinearGradient(0,0,0,canvas.height);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(1, '#E0F6FF');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Clouds exactly like screenshot
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.ellipse(70, 70 + backgroundOffset * 0.3, 45, 35, 0, 0, Math.PI*2);
        ctx.ellipse(115, 60 + backgroundOffset * 0.3, 40, 30, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(300, 110 + backgroundOffset * 0.3, 50, 38, 0, 0, Math.PI*2);
        ctx.ellipse(350, 100 + backgroundOffset * 0.3, 42, 32, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(200, 180 + backgroundOffset * 0.2, 35, 28, 0, 0, Math.PI*2);
        ctx.fill();
    }
    
    function drawPipes() {
        for(let pipe of pipes) {
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.topHeight - 25, pipeWidth - 10, 20);
            
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            ctx.fillStyle = '#1B5E20';
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 30);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(pipe.x + 5, pipe.bottomY + 5, pipeWidth - 10, 20);
        }
    }
    
    function drawBird() {
        wingAngle = (wingAngle + 0.2) % (Math.PI * 2);
        const wingOffset = Math.sin(wingAngle) * 5;
        
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(Math.min(Math.max(bird.velocity * 0.08, -0.5), 0.7));
        
        // Bird body - exactly like screenshot
        ctx.fillStyle = '#FFD966';
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.radius, bird.radius * 0.9, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#E6A817';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Eye
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(5, -3, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -4, 1, 0, Math.PI*2);
        ctx.fill();
        
        // Wing
        ctx.fillStyle = '#FFAA44';
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(-15 + wingOffset, -5);
        ctx.lineTo(-15 + wingOffset, 5);
        ctx.fill();
        
        // Beak
        ctx.fillStyle = '#FF6600';
        ctx.beginPath();
        ctx.moveTo(11, -2);
        ctx.lineTo(19, 0);
        ctx.lineTo(11, 2);
        ctx.fill();
        
        // Little hair on top
        ctx.fillStyle = '#E6A817';
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(-3, -20);
        ctx.lineTo(3, -18);
        ctx.fill();
        
        ctx.restore();
    }
    
    function drawGround() {
        ctx.fillStyle = '#6B4E3A';
        ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
        ctx.fillStyle = '#8B5A2B';
        for(let i=0; i<20; i++) {
            ctx.fillRect(i*30 + (backgroundOffset % 30), canvas.height-55, 15, 8);
        }
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
    }
    
    function drawScoreOnCanvas() {
        if(gameActive && gameRunning) {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 42px monospace';
            ctx.shadowBlur = 0;
            ctx.fillText(score, canvas.width/2 - 15, 80);
        }
    }
    
    function draw() {
        drawBackground();
        drawPipes();
        drawBird();
        drawGround();
        drawScoreOnCanvas();
        
        if(!gameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 24px monospace';
            ctx.fillText('FLAPPY BIRD', canvas.width/2-100, canvas.height/2-30);
            ctx.fillStyle = 'white';
            ctx.font = '14px monospace';
            ctx.fillText('TAP TO START', canvas.width/2-55, canvas.height/2+20);
        }
        
        if(!gameRunning && gameActive) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#ffaa44';
            ctx.font = 'bold 26px monospace';
            ctx.fillText('GAME OVER', canvas.width/2-85, canvas.height/2-30);
            ctx.fillStyle = 'white';
            ctx.font = '16px monospace';
            ctx.fillText(`SCORE: ${score}`, canvas.width/2-50, canvas.height/2+20);
        }
    }
    
    // ==================== EVENT LISTENERS ====================
    canvas.addEventListener('click', () => {
        if(!gameActive) {
            document.getElementById('mainMenu').classList.add('hide');
            gameActive = true;
            initGame();
        }
        jump();
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(!gameActive) {
            document.getElementById('mainMenu').classList.add('hide');
            gameActive = true;
            initGame();
        }
        jump();
    });
    
    document.getElementById('playBtn').onclick = () => {
        document.getElementById('mainMenu').classList.add('hide');
        gameActive = true;
        initGame();
    };
    
    document.getElementById('tournamentBtn').onclick = () => {
        alert('Tournaments coming soon!');
    };
    
    document.getElementById('storeMenuBtn').onclick = () => {
        alert('Store coming soon!');
    };
    
    document.getElementById('scoresMenuBtn').onclick = () => {
        alert(`Best Score: ${bestScore}`);
    };
    
    document.getElementById('optionsMenuBtn').onclick = () => {
        alert('Options coming soon!');
    };
    
    document.getElementById('restartBtn').onclick = () => {
        restartGame();
    };
    
    updateUI();
    
    function gameLoop() {
        updateGame();
        draw();
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>
</body>
</html>
